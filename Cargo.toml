[package]
name = "good-search"
version = "0.2.0"
edition = "2021"
description = "Local-first Rust knowledge engine with indexing, hybrid search, OCR and a local API"
license = "AGPL-3.0-only"

[[bin]]
name = "gsearch"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
blake3 = "1.5"
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
glob = "0.3"
libc = "0.2"
quick-xml = "0.37"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tiny_http = "0.12"
url = "2"
toml = "0.8"
walkdir = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
# CPU-only Rust OCR. Models are stored separately under GSEARCH_MODELS_DIR.
pure-onnx-ocr = { version = "0.3.2", default-features = false }
texo-ocr = { git = "https://github.com/studio-ransom/best-ocr-rust", default-features = false }
# Optional-at-runtime local embeddings; models load only when semantic indexing/search is requested.
fastembed = "7.7.1"
ffai-argus = { version = "0.7", optional = true }
ffai-core = { version = "0.8", optional = true }
ffai-media = { version = "0.6", optional = true }

[features]
default = []
image-captioning = ["dep:ffai-argus", "dep:ffai-core", "dep:ffai-media"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
