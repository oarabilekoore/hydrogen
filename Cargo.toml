[package]
name = "hydrogen"
version = "0.1.0"
edition = "2021"
description = "Unified native daemon and CLI backend for Quickshell Launcher, Search, OCR, and Calendar"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
glob = "0.3"
libc = "0.2"
quick-xml = "0.37"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
walkdir = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
