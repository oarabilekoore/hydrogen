<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hydrogen Capture</title><style>
body{width:290px;margin:0;padding:16px;background:#101215;color:#e8eaf0;font:13px/1.5 system-ui}h1{font-size:16px;margin:0 0 4px}.muted{color:#929aa6;margin:0 0 16px}label{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid #292e35}button{width:100%;margin-top:10px;padding:10px;border:1px solid #3b4552;border-radius:8px;background:#dbe5f7;color:#141820;font-weight:650}#status{margin-top:10px;color:#aab4c2;overflow-wrap:anywhere}
</style></head><body><h1>Hydrogen Capture</h1><p class="muted">Save readable pages and supported AI conversations locally.</p>
<label>Capture automatically <input id="enabled" type="checkbox"></label>
<label>Articles and blogs <input id="captureArticles" type="checkbox"></label>
<label>AI conversations <input id="captureChats" type="checkbox"></label>
<label style="display:block">Excluded domains <textarea id="excludedHosts" rows="3" placeholder="bank.example, private.example" style="display:block;width:100%;margin-top:7px;box-sizing:border-box;background:#191c20;color:#e8eaf0;border:1px solid #3b4552;border-radius:7px;padding:8px"></textarea></label>
<p class="muted" style="font-size:11px;margin:0">Comma-separated hostnames. Subdomains are excluded too.</p>
<label>Hydrogen service URL <input id="apiBase" type="url" placeholder="http://127.0.0.1:17891"></label>
<label style="display:block">API token <input id="apiToken" type="password" autocomplete="off" placeholder="Paste token from hydrogen --print-api-token" style="display:block;width:100%;margin-top:7px;box-sizing:border-box;background:#191c20;color:#e8eaf0;border:1px solid #3b4552;border-radius:7px;padding:8px"></label>
<button id="pair" type="button">Pair with Hydrogen</button>
<button id="ignoreSite" type="button">Ignore this site</button>
<button id="capture">Save this page now</button><button id="importHistory" type="button">Import recent history · 30 days</button><div id="status"></div><script src="popup.js"></script></body></html>
