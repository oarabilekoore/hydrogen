name: Rust CI

on:
  push:
    branches: [main, feature/rust-multimodal-index]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    name: Format and compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply rustfmt and commit formatting
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" FETCH_HEAD
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: apply rustfmt"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Compile
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Check optional image-captioning backend
        run: cargo check --all-targets --features image-captioning
