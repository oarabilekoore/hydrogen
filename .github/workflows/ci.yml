name: Rust CI

on:
  push:
    branches: [main, feature/rust-multimodal-index]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Format and compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Compile
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Validate bundled frontend JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("src/frontend/index.html").read_text()
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No bundled frontend script found")
          Path("/tmp/hydrogen-frontend.js").write_text("\n".join(scripts))
          PY
          node --check /tmp/hydrogen-frontend.js
      - name: Validate browser extension manifests
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          firefox = json.loads(Path("browser-extension/manifest.json").read_text())
          chromium = json.loads(Path("browser-extension/manifest.chromium.json").read_text())

          assert firefox["manifest_version"] == 3
          assert firefox["background"].get("scripts") == ["background.js"]
          assert "service_worker" not in firefox["background"]

          assert chromium["manifest_version"] == 3
          assert chromium["background"].get("service_worker") == "background.js"
          assert "scripts" not in chromium["background"]
          PY
          node --check browser-extension/background.js
          node --check browser-extension/vendor/Readability.js
          node --check browser-extension/content.js
          node --check browser-extension/popup.js
      - name: Check optional image-captioning backend
        run: cargo check --all-targets --features image-captioning
