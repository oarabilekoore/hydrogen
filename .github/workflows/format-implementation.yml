name: Format implementation branch

on:
  push:
    branches: [feature/personal-knowledge-engine]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/personal-knowledge-engine
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add '*.rs'
            git commit -m "style: apply rustfmt to implementation branch"
            git push origin HEAD:feature/personal-knowledge-engine
          fi
